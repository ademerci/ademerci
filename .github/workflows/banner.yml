name: banner
on:
  schedule: [{ cron: "5 * * * *" }]   # hourly; the generator picks day/dawn/sunset/night in Europe/Zurich time
  workflow_dispatch:
  push: { branches: [main] }
permissions: { contents: write }
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir dist && node gen.mjs > dist/banner.svg
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: banner-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
